[[mgr.keymap]]
desc = "Drag n Drop"
on = ["d", "f"]
run = "shell --confirm 'dragon-drop -x -a \"$@\"' "

[[mgr.keymap]]
desc = "New Project"
on = ["c", "e"]
run = "plugin new-project"

[[mgr.keymap]]
desc = "Load Template"
on = ["c", "t"]
run = "plugin load-template"

[[mgr.keymap]]
desc = "Unzip file"
on = ["z", "u"]
run = "shell --confirm 'unzip \"$1\"' "

[[mgr.keymap]]
desc = "Compress archives"
on = ["c", "a"]
run = "plugin compress"

[[mgr.keymap]]
desc = "Compress archives (password)"
on = ["c", "p"]
run = "plugin compress -p"

[[mgr.keymap]]
desc = "Compress archives (password + header)"
on = ["c", "h"]
run = "plugin compress -ph"

[[mgr.keymap]]
desc = "Compress archives (compression level)"
on = ["c", "l"]
run = "plugin compress -l"

[[mgr.keymap]]
desc = "Compress archives (password + header + level)"
on = ["c", "u"]
run = "plugin compress -phl"

[[mgr.keymap]]
desc = "Restore last deleted files/folders"
on = "u"
run = "plugin restore"

[[mgr.keymap]]
desc = "Restore last deleted files/folders (Interactive)"
on = "U"
run = "plugin restore -- --interactive"

[[mgr.keymap]]
desc = "Open help"
on = ["g", "?"]
run = "help"

[[mgr.keymap]]
desc = "Lazy Git"
on = ["<Space>", "l", "g"]
run = "plugin lazygit"

[[mgr.keymap]]
desc = "Mount Menu"
on = ["M"]
run = "plugin mount"

[[mgr.keymap]]
desc = "Teste Local Shell"
on = ["<A-s>"]
run = "plugin local-shell -abs -c --show"

[[mgr.select.keymap]]
desc = "Cancel selection"
on = ["<Esc>"]
run = "close"

[[mgr.select.keymap]]
desc = "Cancel selection"
on = ["<C-[>"]
run = "close"

[[mgr.select.keymap]]
desc = "Cancel selection"
on = ["<C-q>"]
run = "close"

[[mgr.select.keymap]]
desc = "Submit the selection"
on = ["<Enter>"]
run = "close --submit"

[[mgr.select.keymap]]
desc = "Move cursor up"
on = ["k"]
run = "arrow -1"

[[mgr.select.keymap]]
desc = "Move cursor down"
on = ["j"]
run = "arrow 1"

[[mgr.select.keymap]]
desc = "Move cursor up 5 lines"
on = ["K"]
run = "arrow -5"

[[mgr.select.keymap]]
desc = "Move cursor down 5 lines"
on = ["J"]
run = "arrow 5"

[[mgr.select.keymap]]
desc = "Move cursor up"
on = ["<Up>"]
run = "arrow -1"

[[mgr.select.keymap]]
desc = "Move cursor down"
on = ["<Down>"]
run = "arrow 1"

[[mgr.select.keymap]]
desc = "Move cursor up 5 lines"
on = ["<S-Up>"]
run = "arrow -5"

[[mgr.select.keymap]]
desc = "Move cursor down 5 lines"
on = ["<S-Down>"]
run = "arrow 5"

[[mgr.select.keymap]]
desc = "Open help"
on = ["~"]
run = "help"

[[mgr.tasks.keymap]]
desc = "Show the tasks manager"
on = ["w"]
run = "show"

[[mgr.tasks.keymap]]
desc = "Hide the task manager"
on = ["<Esc>"]
run = "close"

[[mgr.tasks.keymap]]
desc = "Hide the task manager"
on = ["<C-[>"]
run = "close"

[[mgr.tasks.keymap]]
desc = "Hide the task manager"
on = ["q"]
run = "close"

[[mgr.tasks.keymap]]
desc = "Hide the task manager"
on = ["w"]
run = "close"

[[mgr.tasks.keymap]]
desc = "Move cursor up"
on = ["k"]
run = "arrow -1"

[[mgr.tasks.keymap]]
desc = "Move cursor down"
on = ["j"]
run = "arrow 1"

[[mgr.tasks.keymap]]
desc = "Move cursor up"
on = ["<Up>"]
run = "arrow -1"

[[mgr.tasks.keymap]]
desc = "Move cursor down"
on = ["<Down>"]
run = "arrow 1"

[[mgr.tasks.keymap]]
desc = "Inspect the task"
on = ["<Enter>"]
run = "inspect"

[[mgr.tasks.keymap]]
desc = "Cancel the task"
on = ["x"]
run = "cancel"

[[mgr.tasks.keymap]]
desc = "Open help"
on = ["~"]
run = "help"
