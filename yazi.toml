[headsup]

[input]
cd_offset = [0, 2, 50, 3]
cd_origin = "top-center"
cd_title = "Change directory:"
create_offset = [0, 2, 50, 3]
create_origin = "top-center"
create_title = ["Create:", "Create Folder:"]
delete_offset = [0, 2, 50, 3]
delete_origin = "top-center"
delete_title = "Delete {n} selected file{s} permanently? (y/N)"
filter_offset = [0, 2, 50, 3]
filter_origin = "top-center"
filter_title = "Filter:"
find_offset = [0, 2, 50, 3]
find_origin = "top-center"
find_title = ["Find next:", "Find previous:"]
overwrite_offset = [0, 2, 50, 3]
overwrite_origin = "top-center"
overwrite_title = "Overwrite an existing file? (y/N)"
quit_offset = [0, 2, 50, 3]
quit_origin = "top-center"
quit_title = "{n} task{s} running, sure to quit? (y/N)"
rename_offset = [0, 1, 50, 3]
rename_origin = "hovered"
rename_title = "Rename:"
search_offset = [0, 2, 50, 3]
search_origin = "top-center"
search_title = "Search via {n}:"
shell_offset = [0, 2, 50, 3]
shell_origin = "top-center"
shell_title = ["Shell:", "Shell (block):"]
trash_offset = [0, 2, 50, 3]
trash_origin = "top-center"
trash_title = "Move {n} selected file{s} to trash? (y/N)"

[log]
enabled = false

[mgr]
linemode = "none"
ratio = [1, 3, 4]
scrolloff = 5
show_hidden = false
show_symlink = true
sort_by = "natural"
sort_dir_first = true
sort_reverse = false
sort_sensitive = false

[[open.rules]]
mime = "text/*"
use = ["edit", "open", "reveal"]

[[open.rules]]
mime = "image/*"
use = ["open", "edit_image", "reveal"]

[[open.rules]]
mime = "{audio,video}/*"
use = ["play", "reveal"]

[[open.rules]]
mime = "inode/x-empty"
use = ["edit", "reveal"]

[[open.rules]]
mime = "application/*zip"
use = ["extract", "reveal"]

[[open.rules]]
mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}"
use = ["extract", "reveal"]

[[open.rules]]
mime = "application/json"
use = ["edit", "reveal"]

[[open.rules]]
mime = "*/javascript"
use = ["edit", "reveal"]

[[open.rules]]
mime = "*"
use = ["open", "edit", "reveal"]

[[open.rules]]
mime = "application/pdf"
use = ["send_to_babel"]

[[opener.edit]]
block = true
desc = "Edit"
for = "unix"
run = "nvim \"$@\""

[[opener.edit]]
desc = "code"
for = "windows"
orphan = true
run = "code \"%*\""

[[opener.edit]]
block = true
desc = "code (block)"
for = "windows"
run = "code -w \"%*\""

[[opener.edit_image]]
desc = "Edit"
for = "linux"
orphan = true
run = "gimp \"$@\""

[[opener.extract]]
desc = "Extract here"
for = "unix"
run = "unar \"$1\""

[[opener.extract]]
desc = "Extract here"
for = "windows"
run = "unar \"%1\""

[[opener.open]]
desc = "Open"
for = "linux"
run = "rifle \"$@\""

[[opener.open]]
desc = "Open"
for = "macos"
run = "open \"$@\""

[[opener.open]]
desc = "Open"
for = "windows"
orphan = true
run = "start \"\" \"%1\""

[[opener.play]]
for = "unix"
orphan = true
run = "kitty -e mpv \"$@\""

[[opener.play]]
for = "windows"
orphan = true
run = "mpv \"%1\""

[[opener.play]]
block = true
desc = "Show media info"
for = "unix"
run = "mediainfo \"$1\"; echo \"Press enter to exit\"; read _"

[[opener.reveal]]
desc = "Reveal"
for = "linux"
run = "xdg-open \"$(dirname \"$0\")\""

[[opener.reveal]]
desc = "Reveal"
for = "macos"
run = "open -R \"$1\""

[[opener.reveal]]
desc = "Reveal"
for = "windows"
orphan = true
run = "explorer /select, \"%1\""

[[opener.reveal]]
block = true
desc = "Show EXIF"
for = "unix"
run = "exiftool \"$1\"; echo \"Press enter to exit\"; read _"

[[opener.send_to_babel]]
desc = "Send to Babel"
for = "linux"
run = "mv \"$@\" ~/Documentos/biblioteca\\ de\\ babel"

[[plugin.preloaders]]
mime = "image/*"
run = "image"

[[plugin.preloaders]]
mime = "video/*"
run = "video"

[[plugin.preloaders]]
mime = "application/pdf"
run = "pdf"

[[plugin.prepend_previewers]]
name = "*/"
run = "folder"
sync = true

[[plugin.prepend_previewers]]
mime = "text/*"
run = "code"

[[plugin.prepend_previewers]]
mime = "*/{xml,javascript,x-wine-extension-ini}"
run = "code"

[[plugin.prepend_previewers]]
mime = "application/json"
run = "json"

[[plugin.prepend_previewers]]
mime = "image/vnd.djvu"
run = "noop"

[[plugin.prepend_previewers]]
mime = "image/*"
run = "image"

[[plugin.prepend_previewers]]
mime = "video/*"
run = "video"

[[plugin.prepend_previewers]]
mime = "application/pdf"
run = "pdf"

[[plugin.prepend_previewers]]
mime = "application/*zip"
run = "archive"

[[plugin.prepend_previewers]]
mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}"
run = "archive"

[[plugin.prepend_previewers]]
name = "*"
run = "file"

[preview]
cache_dir = ""
image_filter = "triangle"
image_quality = 75
max_height = 900
max_width = 600
sixel_fraction = 15
tab_size = 2
ueberzug_offset = [0, 0, 0, 0]
ueberzug_scale = 1

[select]
open_offset = [0, 1, 50, 7]
open_origin = "hovered"
open_title = "Open with:"

[tasks]
bizarre_retry = 5
image_alloc = 536870912
image_bound = [0, 0]
macro_workers = 25
micro_workers = 10
suppress_preload = false

[which]
sort_by = "none"
sort_reverse = false
sort_sensitive = false
